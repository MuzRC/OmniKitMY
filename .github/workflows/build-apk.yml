name: Build & Sign Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Pasang dependency & compile fail web Vite ke folder dist
      - name: Install Web Dependencies & Build
        run: |
          npm install --legacy-peer-deps
          npm run build

      # 2. Pasang Capacitor & setup perumah Android secara automatik
      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap add android
          npx cap sync android

      # 3. Selesaikan isu duplicate class Kotlin (exclude jdk7 & jdk8 lapuk)
      - name: Fix Kotlin Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      # 4. Suntik permission sensor, kamera & audio guna Node.js
      - name: Inject Android Permissions
        run: |
          node -e '
          const fs = require("fs");
          const file = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(file, "utf8");
          const perms = `
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.VIBRATE" />
          `;
          xml = xml.replace("<application", perms + "\n    <application");
          fs.writeFileSync(file, xml, "utf8");
          console.log("Permissions berjaya disuntik!");
          '

      # 5. Compile Release APK (Unsigned) guna Gradle
      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # 6. Tandatangani APK guna GitHub Secrets
      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          $BUILD_TOOLS_PATH/apksigner sign \
            --ks release.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

          rm -f release.jks

      # 7. Simpan fail APK siap ditandatangani untuk dimuat turun
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniKit-Signed-Release-APK
          path: app-release-signed.apk
